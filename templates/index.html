<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Tag APSL Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .data-readout {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .data-box {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
        }

        .data-value {
            font-size: 24px;
            font-weight: bold;
            color: #0d6efd;
        }

        canvas {
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            cursor: crosshair;
        }

        select,
        button {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            cursor: pointer;
        }

        button {
            background-color: #0d6efd;
            color: white;
            border: none;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        #analysisResult img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h2>Echo-Acoustic Haptic Compass System</h2>

    <div class="dashboard-container">
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>2D Tracking Arena</h3>
                <select id="objectSelect">
                    <option value="Keys">Target: Keys (Staccato)</option>
                    <option value="Wallet">Target: Wallet (Heartbeat)</option>
                </select>
            </div>
            <canvas id="simCanvas" width="600" height="400"></canvas>

            <div class="data-readout" style="margin-top: 15px;">
                <div class="data-box">
                    <div style="font-size: 14px;">Distance ($d$)</div>
                    <div id="distanceDisplay" class="data-value">0.00 mm</div>
                </div>
                <div class="data-box">
                    <div style="font-size: 14px;">Acoustic Phase-Shift ($\Delta\phi$)</div>
                    <div id="phaseDisplay" class="data-value">0.0000 rad</div>
                </div>
            </div>
        </div>

        <div class="panel" style="width: 400px;">
            <h3>Haptic Lexicon Output (LRA)</h3>
            <canvas id="waveCanvas" width="400" height="150"></canvas>

            <hr style="margin: 20px 0; border: 1px solid #eee;">

            <h3>ML Path Analysis</h3>
            <p style="font-size: 14px; color: #666;">Apply K-Means clustering to MySQL tracking logs to identify search
                hesitation zones.</p>
            <button onclick="runAnalysis()">Generate Path Graph</button>
            <div id="analysisResult"></div>
        </div>
    </div>

    <script>
        // Setup Canvas Contexts
        const simCanvas = document.getElementById('simCanvas');
        const simCtx = simCanvas.getContext('2d');
        const waveCanvas = document.getElementById('waveCanvas');
        const waveCtx = waveCanvas.getContext('2d');

        // DOM Elements
        const distanceDisplay = document.getElementById('distanceDisplay');
        const phaseDisplay = document.getElementById('phaseDisplay');
        const objectSelect = document.getElementById('objectSelect');
        const analysisResult = document.getElementById('analysisResult');

        // State Variables
        const tagX = Math.random() * (simCanvas.width - 100) + 50;
        const tagY = Math.random() * (simCanvas.height - 100) + 50;
        let mouseX = simCanvas.width / 2;
        let mouseY = simCanvas.height / 2;
        let currentDistMm = 0;
        let time = 0; // For waveform animation

        // Event Listeners
        simCanvas.addEventListener('mousemove', (e) => {
            const rect = simCanvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            const distPixels = Math.sqrt(Math.pow(mouseX - tagX, 2) + Math.pow(mouseY - tagY, 2));
            currentDistMm = distPixels * 10; // Scale to mm

            fetch('/calculate_apls', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    distance_mm: currentDistMm,
                    x: mouseX,
                    y: mouseY,
                    object_id: objectSelect.value
                })
            })
                .then(response => response.json())
                .then(data => {
                    distanceDisplay.innerText = data.distance_mm.toFixed(2) + ' mm';
                    phaseDisplay.innerText = data.phase_shift_radians.toFixed(4) + ' rad';
                });
        });

        // Animation Loop
        function draw() {
            // 1. Draw Tracking Arena
            simCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);
            simCtx.fillStyle = '#0d6efd';
            simCtx.beginPath();
            simCtx.arc(mouseX, mouseY, 8, 0, Math.PI * 2);
            simCtx.fill();

            // 2. Draw Haptic Waveform (Oscilloscope)
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
            waveCtx.beginPath();
            waveCtx.strokeStyle = '#dc3545';
            waveCtx.lineWidth = 2;

            // Map distance to a frequency multiplier
            const normalizedDist = Math.max(0.1, currentDistMm / 1000);
            const frequency = 1 / normalizedDist;

            for (let i = 0; i < waveCanvas.width; i++) {
                let y = waveCanvas.height / 2;

                if (objectSelect.value === 'Keys') {
                    // Staccato (Square Wave)
                    const period = 50 / frequency;
                    y += ((i + time) % period < period / 2) ? 40 : -40;
                } else {
                    // Heartbeat (Pulsed Sine Wave)
                    const beatCycle = (i + time) % (200 / frequency);
                    if (beatCycle < 40) {
                        y += Math.sin(beatCycle * 0.3) * 40; // Lub
                    } else if (beatCycle > 60 && beatCycle < 100) {
                        y += Math.sin((beatCycle - 60) * 0.4) * 30; // Dub
                    }
                }

                if (i === 0) waveCtx.moveTo(i, y);
                else waveCtx.lineTo(i, y);
            }
            waveCtx.stroke();
            time += 2; // Advance waveform

            requestAnimationFrame(draw);
        }

        draw();

        // ML Trigger Function
        function runAnalysis() {
            analysisResult.innerHTML = '<p style="color: #0d6efd;">Running K-Means Clustering on MySQL logs...</p>';
            fetch('/analyze_path')
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        analysisResult.innerHTML = `<p style="color: red;">${data.error}</p>`;
                    } else if (data.graph_url) {
                        analysisResult.innerHTML = `<img src="${data.graph_url}" alt="K-Means Cluster Path">`;
                    }
                });
        }
    </script>
</body>

</html>
